<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex" />
		<title>sandbox relay</title>
	</head>
	<body>
		<script type="module">
			// The relay lives on the sandbox origin, embedded (invisibly) in the tutorial page.
			// It registers the service worker, creates the sandbox worker, and forwards
			// requests from the service worker to the sandbox worker. The tutorial page
			// talks to the sandbox worker directly, via a MessagePort.
			//
			// This file (and the service worker) are deployed separately from svelte.dev,
			// so they should stay small and generic. The worker's code comes from whichever
			// svelte.dev deployment is embedding the relay

			/**
			 * The version of the protocol spoken between the tutorial page, the relay, the
			 * service worker and the sandbox worker. Bump this (and the matching constant in
			 * `apps/svelte.dev/src/lib/tutorial/adapters/sandbox/index.svelte.ts`) when
			 * making incompatible changes
			 */
			const VERSION = 1;

			/** Sites that are allowed to run code in the sandbox */
			const allowed = [
				// production, and the pre-release site
				/^https:\/\/(next\.)?svelte\.dev$/,
				// deployments of the `svelte-dev` and `next-svelte-dev` Vercel projects,
				// e.g. https://svelte-ij7na4dtv-svelte.vercel.app...
				/^https:\/\/(next-)?svelte-[a-z0-9]+-svelte\.vercel\.app$/,
				// ...and their branch aliases, e.g. https://svelte-dev-git-my-branch-svelte.vercel.app
				/^https:\/\/(next-)?svelte-dev-git-[a-z0-9-]+-svelte\.vercel\.app$/,
				// local development
				/^http:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$/
			];

			const parent_origin = new URL(location.href).searchParams.get('parent') ?? '';

			if (window.parent === window || !allowed.some((pattern) => pattern.test(parent_origin))) {
				throw new Error(`${parent_origin || 'This page'} is not allowed to use the sandbox`);
			}

			/** @param {any} data */
			function post(data) {
				parent.postMessage(data, parent_origin);
			}

			try {
				const registration = await navigator.serviceWorker.register('/__sandbox_sw.js', {
					scope: '/'
				});

				// each session gets its own origin, so clean up after ourselves
				window.addEventListener('pagehide', () => registration.unregister());

				await navigator.serviceWorker.ready;

				// wait for `clients.claim()`, so that the worker we create is controlled
				// (poll, since `controllerchange` may already have fired)
				while (!navigator.serviceWorker.controller) {
					await new Promise((fulfil) => setTimeout(fulfil, 20));
				}
			} catch (e) {
				post({ type: 'relay-error', message: `Failed to register service worker: ${e.message}` });
				throw e;
			}

			/** @type {Worker | null} */
			let worker = null;

			/** @type {any[]} */
			const queue = [];

			navigator.serviceWorker.onmessage = (e) => {
				if (e.data?.type !== 'request') return;

				if (worker) {
					worker.postMessage(e.data, [e.data.port]);
				} else {
					queue.push(e.data);
				}
			};

			window.addEventListener('message', (e) => {
				if (e.origin !== parent_origin || e.source !== window.parent) return;

				if (e.data.type === 'init') {
					if (e.data.version !== VERSION) {
						post({
							type: 'relay-error',
							message: `Sandbox version mismatch (expected ${VERSION}, got ${e.data.version})`
						});
						return;
					}

					// only run code that belongs to the site embedding us
					const url = new URL(e.data.worker);
					if (url.origin !== parent_origin) {
						post({ type: 'relay-error', message: `Refusing to load worker from ${url.origin}` });
						return;
					}

					worker?.terminate();

					// the worker's code lives on a different origin (the svelte.dev deployment),
					// so we create a same-origin blob worker that imports it. The blob worker
					// is controlled by our service worker, which it needs to load server modules
					const src = URL.createObjectURL(
						new Blob([`import ${JSON.stringify(url.href)};`], { type: 'text/javascript' })
					);

					worker = new Worker(src, { type: 'module' });

					worker.onerror = (event) => {
						post({ type: 'relay-error', message: event.message || 'Sandbox worker failed' });
					};

					worker.postMessage({ type: 'init', port: e.data.port }, [e.data.port]);

					for (const data of queue.splice(0)) {
						worker.postMessage(data, [data.port]);
					}
				}
			});

			post({ type: 'relay-ready', version: VERSION });
		</script>
	</body>
</html>
