minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@sveltejs/*'
  - '@twinkleplop/*'
  - svelte
  - sv
  - esrap
  - devalue
  - zimmerframe
  - prettier-plugin-svelte
  - svelte-check
  - esm-env
  - vite-imagetools
  - imagetools-core
blockExoticSubdeps: true
engineStrict: true
allowBuilds:
  esbuild: true
  sharp: true
  svelte-preprocess: true

packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  '@sveltejs/kit': https://pkg.svelte.dev/@sveltejs/kit/c/2e9e7f82e7e8f19057cd2670ba6c9341ef95fa4e
  '@types/node': ^22.19.20
  vite: ^8.0.16
  vitest: ^4.1.8

catalogs:
  sveltekit-2:
    '@sveltejs/kit': ^2.70.2

overrides:
  # This is a workaround to avoid the "exotic dependency is not allowed in subdependencies"
  # error that pnpm throws when `blockExoticSubdeps` is enabled
  'sv>@sveltejs/sv-utils': '-'
